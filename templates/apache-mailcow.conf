# mailcow-behind-apache: reverse proxy for the mailcow UI, SOGo webmail, ActiveSync and autodiscover.
# Generated by scripts/02-apache-proxy.sh from templates/apache-mailcow.conf.
# Placeholders: __MAIL_HOSTNAME__ __DOMAIN_BASE__ __HTTPS_PORT__

<VirtualHost *:80>
    ServerName __MAIL_HOSTNAME__
    ServerAlias autodiscover.__DOMAIN_BASE__ autoconfig.__DOMAIN_BASE__
    # certbot's HTTP-01 challenge is answered by Apache itself (--apache), everything else goes to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __MAIL_HOSTNAME__
    ServerAlias autodiscover.__DOMAIN_BASE__ autoconfig.__DOMAIN_BASE__

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    # mailcow serves HTTPS on loopback with the same certificate; the name check is pointless on 127.0.0.1
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Exchange ActiveSync keeps long-polling connections open
    ProxyPass /Microsoft-Server-ActiveSync https://127.0.0.1:__HTTPS_PORT__/Microsoft-Server-ActiveSync connectiontimeout=4000
    ProxyPassReverse /Microsoft-Server-ActiveSync https://127.0.0.1:__HTTPS_PORT__/Microsoft-Server-ActiveSync

    # SOGo / mailcow UI websockets
    ProxyPass /websocket wss://127.0.0.1:__HTTPS_PORT__/websocket
    ProxyPassReverse /websocket wss://127.0.0.1:__HTTPS_PORT__/websocket

    ProxyPass / https://127.0.0.1:__HTTPS_PORT__/
    ProxyPassReverse / https://127.0.0.1:__HTTPS_PORT__/

    # Large attachments and slow mailbox operations
    ProxyTimeout 300
    Timeout 300
    LimitRequestBody 0

    ErrorLog ${APACHE_LOG_DIR}/mailcow-error.log
    CustomLog ${APACHE_LOG_DIR}/mailcow-access.log combined
</VirtualHost>
</IfModule>

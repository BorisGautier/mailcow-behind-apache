# Same checks as GitHub Actions (.github/workflows/ci.yml) for the GitLab mirror.
stages: [lint, test]

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck -x scripts/*.sh scripts/dns/*.sh templates/*.sh tests/*.sh

unit-tests:
  stage: test
  image: bats/bats:1.11.0
  before_script:
    - apk add --no-cache jq openssl >/dev/null
  script:
    - bats --print-output-on-failure tests

apache:
  stage: test
  image: debian:12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq apache2 openssl >/dev/null
  script:
    - tests/apache-configtest.sh

mailcow-upstream:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null && pip install -q pyyaml
  script:
    - tests/mailcow-upstream.sh
  # depends on mailcow's master branch: informative on GitLab, blocking on GitHub
  allow_failure: true
